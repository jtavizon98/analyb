[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "analyb"
version = "0.1.0"
description = "Small analysis+plotting library for TTree-based HEP work"
license = {file = "LICENSE"}
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "polars[rtcompat]",
    "pyarrow",
    "uproot",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.package-data]
analyb = ["styles/*.mplstyle"]
